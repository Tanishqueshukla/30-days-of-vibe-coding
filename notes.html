<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — VibeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2129;
      --text: #e6edf3;
      --text-sec: #8b949e;
      --text-muted: #484f58;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --teal: #39d0d8;
      --border: #21262d;
      --border-light: #30363d;
      --code-bg: #0d1117;
      --success: #3fb950;
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== LAYOUT ===== */
    .app {
      display: flex;
      width: 100%; height: 100%;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      min-width: 240px;
      max-width: 360px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      resize: horizontal;
      overflow: auto;
    }

    .sb-header {
      padding: 16px 18px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .sb-header h2 {
      font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    }
    .sb-new {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 6px;
      padding: 5px 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .sb-new:hover { background: var(--accent-hover); }

    .sb-search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sb-search input {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.15s;
    }
    .sb-search input:focus { border-color: var(--accent); }
    .sb-search input::placeholder { color: var(--text-muted); }

    .sb-list {
      flex: 1; overflow-y: auto;
      padding: 6px;
    }
    .sb-list::-webkit-scrollbar { width: 5px; }
    .sb-list::-webkit-scrollbar-track { background: transparent; }
    .sb-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    .note-item {
      padding: 10px 12px; border-radius: 8px;
      cursor: pointer; transition: all 0.12s;
      margin-bottom: 2px; position: relative;
    }
    .note-item:hover { background: var(--surface-hover); }
    .note-item.active {
      background: rgba(88,166,255,0.06);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .note-item .ni-title {
      font-size: 13.5px; font-weight: 500;
      color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .note-item.active .ni-title { color: var(--accent); }
    .note-item .ni-preview {
      font-size: 11.5px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-item .ni-time {
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-muted); margin-top: 4px;
    }
    .note-item .ni-menu {
      position: absolute; top: 8px; right: 8px;
      opacity: 0; transition: opacity 0.15s;
      background: var(--surface-hover); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 6px; font-size: 11px; color: var(--text-sec);
      cursor: pointer;
    }
    .note-item:hover .ni-menu { opacity: 1; }
    .note-item .ni-menu:hover { color: var(--text); }

    .sb-empty {
      padding: 40px 20px; text-align: center;
      color: var(--text-muted); font-size: 13px;
    }

    /* ===== EDITOR ===== */
    .editor-wrap {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0; background: var(--bg);
    }

    .editor-toolbar {
      height: 48px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; flex-shrink: 0;
    }
    .et-title-wrap { flex: 1; min-width: 0; }
    .et-title {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 16px; font-weight: 600;
      width: 100%; padding: 4px 0;
    }
    .et-title::placeholder { color: var(--text-muted); }
    .et-meta {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-muted);
    }
    .et-export {
      font-family: var(--font-mono); font-size: 11px;
      background: transparent; color: var(--text-sec);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; cursor: pointer; transition: all 0.15s;
    }
    .et-export:hover { border-color: var(--accent); color: var(--accent); }
    .et-save {
      font-size: 11px; color: var(--success);
      opacity: 0; transition: opacity 0.3s;
    }
    .et-save.show { opacity: 1; }

    .editor-body {
      flex: 1; overflow-y: auto;
      padding: 24px 32px 80px;
      max-width: 800px; width: 100%; margin: 0 auto;
    }
    .editor-body::-webkit-scrollbar { width: 6px; }
    .editor-body::-webkit-scrollbar-track { background: transparent; }
    .editor-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    /* ===== BLOCKS ===== */
    .block {
      position: relative;
      margin-bottom: 2px;
      min-height: 36px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .block:hover { background: rgba(255,255,255,0.015); }
    .block:focus-within { background: rgba(255,255,255,0.02); }

    .block-content {
      outline: none; min-height: 28px;
      line-height: 1.6; font-size: 15px;
      color: var(--text); word-break: break-word;
    }
    .block-content:empty::before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Block types */
    .block.h1 .block-content {
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.5px; line-height: 1.3;
      margin-top: 8px; margin-bottom: 4px;
    }
    .block.h2 .block-content {
      font-size: 22px; font-weight: 600;
      letter-spacing: -0.3px; line-height: 1.3;
      margin-top: 6px; margin-bottom: 2px;
    }
    .block.h3 .block-content {
      font-size: 18px; font-weight: 600;
      line-height: 1.3; margin-top: 4px;
    }
    .block.quote {
      border-left: 3px solid var(--accent);
      padding-left: 14px; margin-left: 4px;
    }
    .block.quote .block-content {
      color: var(--text-sec); font-style: italic;
    }
    .block.code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
      margin: 4px 0;
    }
    .block.code .block-content {
      font-family: var(--font-mono); font-size: 13px;
      line-height: 1.6; color: var(--text-sec);
      white-space: pre-wrap; word-break: break-all;
    }
    .block.code .block-content:empty::before {
      content: "// code...";
      color: var(--text-muted);
    }
    .block.divider {
      padding: 8px 0; pointer-events: none;
    }
    .block.divider::after {
      content: ''; display: block;
      height: 1px; background: var(--border-light);
    }
    .block.todo {
      display: flex; align-items: flex-start; gap: 8px;
      padding-left: 4px;
    }
    .block.todo .todo-check {
      width: 16px; height: 16px; min-width: 16px;
      border: 2px solid var(--border-light); border-radius: 4px;
      margin-top: 6px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: transparent;
    }
    .block.todo .todo-check:hover { border-color: var(--accent); }
    .block.todo.checked .todo-check {
      background: var(--accent); border-color: var(--accent);
      color: var(--bg);
    }
    .block.todo.checked .block-content {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .block.todo .block-content { flex: 1; }
    .block.bullet, .block.numbered {
      display: flex; align-items: flex-start; gap: 8px;
      padding-left: 4px;
    }
    .block.bullet::before, .block.numbered::before {
      content: '•'; color: var(--text-sec);
      margin-top: 4px; font-size: 14px; min-width: 16px; text-align: center;
    }
    .block.numbered::before { content: attr(data-num) '.'; font-family: var(--font-mono); font-size: 12px; }
    .block.bullet .block-content, .block.numbered .block-content { flex: 1; }

    /* ===== CODE LANGUAGE BADGE ===== */
    .code-lang-badge {
      position: absolute;
      top: 6px; right: 10px;
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 8px; cursor: pointer; z-index: 2;
      transition: all 0.15s;
    }
    .code-lang-badge:hover {
      color: var(--accent); border-color: var(--accent);
    }
    .block.code { position: relative; padding-top: 28px; }
    .block.code .block-content { color: var(--text-sec); }
    .block.code .block-content.editing { color: var(--text); }

    /* ===== IMAGE & MEDIA BLOCKS ===== */
    .block.image, .block.media { padding: 8px; }
    .image-container, .media-container {
      border: 1px dashed var(--border-light); border-radius: 8px;
      overflow: hidden; margin-bottom: 6px;
      min-height: 120px; display: flex;
      align-items: center; justify-content: center;
      position: relative;
    }
    .image-container img {
      max-width: 100%; display: block; border-radius: 6px;
    }
    .media-container iframe, .media-container video {
      width: 100%; height: 220px; border: none;
      border-radius: 6px; display: block;
    }
    .image-placeholder, .media-placeholder {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      padding: 24px; color: var(--text-muted);
      font-size: 13px;
    }
    .image-placeholder input, .media-placeholder input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
      color: var(--text); font-size: 12px;
      width: 260px; outline: none;
      font-family: var(--font-ui);
    }
    .image-placeholder input:focus, .media-placeholder input:focus {
      border-color: var(--accent);
    }

    /* ===== SLASH MENU ===== */
    .slash-menu {
      position: absolute;
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 6px;
      min-width: 220px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      z-index: 1000; display: none;
      animation: menuIn 0.12s ease;
    }
    @keyframes menuIn {
      from { opacity: 0; transform: scale(0.96) translateY(-4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .slash-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 6px;
      cursor: pointer; font-size: 13px; color: var(--text-sec);
      transition: all 0.1s;
    }
    .slash-item:hover, .slash-item.active {
      background: rgba(88,166,255,0.08); color: var(--text);
    }
    .slash-item .si-icon {
      width: 28px; height: 28px; min-width: 28px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .slash-item .si-label { flex: 1; }
    .slash-item .si-kbd {
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-muted); background: var(--bg);
      padding: 2px 6px; border-radius: 4px;
    }

    /* ===== LANGUAGE PICKER ===== */
    .lang-picker {
      position: absolute; background: var(--surface);
      border: 1px solid var(--border-light); border-radius: 10px;
      padding: 6px; min-width: 200px; max-height: 320px;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      z-index: 1000; display: none;
      animation: menuIn 0.12s ease;
    }
    .lang-picker.show { display: block; }
    .lang-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 6px;
      cursor: pointer; font-size: 13px; color: var(--text-sec);
      transition: all 0.1s;
    }
    .lang-item:hover, .lang-item.active {
      background: rgba(88,166,255,0.08); color: var(--text);
    }
    .lang-item .li-kbd {
      margin-left: auto; font-family: var(--font-mono);
      font-size: 10px; color: var(--text-muted);
      background: var(--bg); padding: 2px 6px; border-radius: 4px;
    }

    /* ===== CONTEXT MENU FOR NOTE ITEMS ===== */
    .note-ctx {
      position: fixed; background: var(--surface);
      border: 1px solid var(--border-light); border-radius: 8px;
      padding: 4px; min-width: 140px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 2000; display: none;
    }
    .note-ctx.show { display: block; }
    .note-ctx-item {
      padding: 8px 12px; border-radius: 6px;
      font-size: 12px; color: var(--text-sec); cursor: pointer;
      transition: all 0.1s;
    }
    .note-ctx-item:hover { background: rgba(88,166,255,0.08); color: var(--text); }
    .note-ctx-item.danger:hover { background: rgba(248,81,73,0.1); color: #f85149; }

    /* ===== STANDALONE BADGE ===== */
    .standalone-badge {
      position: fixed; bottom: 16px; left: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-sec); z-index: 5000;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: badgeIn 0.4s ease 1s both;
    }
    @keyframes badgeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .standalone-badge a {
      color: var(--accent); text-decoration: none;
    }
    .standalone-badge a:hover { text-decoration: underline; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .sidebar { width: 100%; position: absolute; z-index: 100; transform: translateX(-100%); transition: transform 0.25s; }
      .sidebar.open { transform: translateX(0); }
      .editor-wrap { width: 100%; }
      .editor-body { padding: 16px 20px 60px; }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <h2>Notes</h2>
        <button class="sb-new" id="btnNew" title="New Note (Ctrl+N)">+ New</button>
      </div>
      <div class="sb-search">
        <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off">
      </div>
      <div class="sb-list" id="noteList"></div>
    </aside>

    <!-- Editor -->
    <div class="editor-wrap">
      <div class="editor-toolbar">
        <div class="et-title-wrap">
          <input type="text" class="et-title" id="noteTitle" placeholder="Untitled Note">
        </div>
        <div class="et-meta">
          <span class="et-save" id="saveStatus">Saved</span>
          <button class="et-export" id="btnExport">Export MD</button>
        </div>
      </div>
      <div class="editor-body" id="editorBody"></div>
    </div>
  </div>

  <!-- Slash Menu -->
  <div class="slash-menu" id="slashMenu"></div>

  <!-- Language Picker -->
  <div class="lang-picker" id="langPicker"></div>

  <!-- Note Context Menu -->
  <div class="note-ctx" id="noteCtx">
    <div class="note-ctx-item" data-action="rename">Rename</div>
    <div class="note-ctx-item" data-action="duplicate">Duplicate</div>
    <div class="note-ctx-item danger" data-action="delete">Delete</div>
  </div>

  <!-- Standalone Badge -->
  <div class="standalone-badge" id="standaloneBadge" style="display:none">
    <span>🚀 Part of <a href="../os.html">VibeOS</a></span>
  </div>

  <script>
    // ===== STATE =====
    let notes = [];
    let activeNoteId = null;
    let saveTimer = null;
    const STORAGE_KEY = 'vibeos_notes';
    const SLASH_ITEMS = [
      { type: 'text', label: 'Text', icon: 'T', desc: 'Just start writing', shortcut: '' },
      { type: 'h1', label: 'Heading 1', icon: 'H1', desc: 'Big section heading', shortcut: '# ' },
      { type: 'h2', label: 'Heading 2', icon: 'H2', desc: 'Medium heading', shortcut: '## ' },
      { type: 'h3', label: 'Heading 3', icon: 'H3', desc: 'Small heading', shortcut: '### ' },
      { type: 'bullet', label: 'Bullet List', icon: '•', desc: 'Create a bullet list', shortcut: '- ' },
      { type: 'numbered', label: 'Numbered List', icon: '1.', desc: 'Create a numbered list', shortcut: '1. ' },
      { type: 'todo', label: 'To-do', icon: '☐', desc: 'Checkbox item', shortcut: '[] ' },
      { type: 'quote', label: 'Quote', icon: '"', desc: 'Blockquote', shortcut: '> ' },
      { type: 'code', label: 'Code', icon: '</>', desc: 'Code block with syntax highlighting', shortcut: '```' },
      { type: 'image', label: 'Image', icon: '🖼', desc: 'Embed an image', shortcut: '' },
      { type: 'media', label: 'Media', icon: '🎬', desc: 'Embed video or iframe', shortcut: '' },
      { type: 'divider', label: 'Divider', icon: '—', desc: 'Horizontal line', shortcut: '---' },
    ];

    const LANGUAGES = [
      { id: 'javascript', label: 'JavaScript' },
      { id: 'python', label: 'Python' },
      { id: 'html', label: 'HTML' },
      { id: 'css', label: 'CSS' },
      { id: 'typescript', label: 'TypeScript' },
      { id: 'bash', label: 'Bash / Shell' },
      { id: 'json', label: 'JSON' },
      { id: 'sql', label: 'SQL' },
      { id: 'rust', label: 'Rust' },
      { id: 'go', label: 'Go' },
      { id: 'java', label: 'Java' },
      { id: 'cpp', label: 'C++' },
      { id: 'markdown', label: 'Markdown' },
      { id: 'plain', label: 'Plain Text' },
    ];
    let langActive = false;
    let langIndex = 0;
    let langTargetBlock = null;

    // ===== INIT =====
    function init() {
      loadNotes();
      if (!notes.length) createWelcomeNote();
      renderSidebar();
      if (notes.length) openNote(notes[0].id);
      setupSlashMenu();
      setupLangPicker();
      setupEvents();
      checkStandalone();
    }

    function checkStandalone() {
      try {
        if (window.self === window.top) {
          document.getElementById('standaloneBadge').style.display = 'flex';
        }
      } catch(e) {
        document.getElementById('standaloneBadge').style.display = 'flex';
      }
    }

    // ===== STORAGE =====
    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) notes = JSON.parse(raw);
      } catch(e) { notes = []; }
    }
    function saveNotes() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch(e) {}
      showSaveStatus();
    }
    function showSaveStatus() {
      const el = document.getElementById('saveStatus');
      el.textContent = 'Saved';
      el.classList.add('show');
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // ===== WELCOME NOTE =====
    function createWelcomeNote() {
      const id = 'welcome-' + Date.now();
      const blocks = [
        { type: 'h1', content: 'Welcome to VibeOS Notes' },
        { type: 'text', content: 'This is a block-based editor built entirely with AI prompts. No code was hand-written.' },
        { type: 'text', content: '' },
        { type: 'h2', content: 'How to use' },
        { type: 'bullet', content: 'Type <code>/</code> to open the slash command menu' },
        { type: 'bullet', content: 'Use markdown shortcuts like <code>#</code>, <code>##</code>, <code>-</code>, <code>[]</code>' },
        { type: 'bullet', content: 'Click the checkbox on a to-do to toggle it' },
        { type: 'text', content: '' },
        { type: 'h2', content: 'Shortcuts' },
        { type: 'text', content: '# Heading 1, ## Heading 2, ### Heading 3' },
        { type: 'text', content: '- Bullet list, 1. Numbered list, [] To-do' },
        { type: 'text', content: '> Quote, ``` Code block, --- Divider' },
        { type: 'text', content: '' },
        { type: 'quote', content: 'The future of building is not about syntax — it is about ideas, taste, and knowing what to ask for.' },
        { type: 'text', content: '' },
        { type: 'code', content: '// Start writing your first note above this line\\n// Press / for commands' },
        { type: 'text', content: '' },
        { type: 'todo', content: 'Build 30 apps in 30 days', checked: false },
        { type: 'todo', content: 'Document everything on LinkedIn', checked: false },
        { type: 'todo', content: 'Ship VibeOS', checked: true },
      ];
      notes.push({
        id, title: 'Welcome to VibeOS Notes',
        blocks, createdAt: Date.now(), updatedAt: Date.now()
      });
      saveNotes();
    }

    // ===== NOTE CRUD =====
    function createNote() {
      const id = 'note-' + Date.now();
      notes.unshift({
        id, title: '',
        blocks: [{ type: 'text', content: '' }],
        createdAt: Date.now(), updatedAt: Date.now()
      });
      saveNotes();
      renderSidebar();
      openNote(id);
      document.getElementById('noteTitle').focus();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      saveNotes();
      renderSidebar();
      if (activeNoteId === id) {
        activeNoteId = null;
        if (notes.length) openNote(notes[0].id);
        else { document.getElementById('noteTitle').value = ''; document.getElementById('editorBody').innerHTML = ''; }
      }
    }

    function duplicateNote(id) {
      const src = notes.find(n => n.id === id);
      if (!src) return;
      const dup = JSON.parse(JSON.stringify(src));
      dup.id = 'note-' + Date.now();
      dup.title = src.title + ' (Copy)';
      dup.createdAt = Date.now();
      dup.updatedAt = Date.now();
      notes.unshift(dup);
      saveNotes();
      renderSidebar();
      openNote(dup.id);
    }

    function renameNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      const newTitle = prompt('Rename note:', note.title);
      if (newTitle !== null) {
        note.title = newTitle.trim();
        note.updatedAt = Date.now();
        saveNotes();
        renderSidebar();
        if (activeNoteId === id) document.getElementById('noteTitle').value = note.title;
      }
    }

    // ===== SIDEBAR =====
    function renderSidebar() {
      const list = document.getElementById('noteList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = q ? notes.filter(n => (n.title || '').toLowerCase().includes(q) || n.blocks.some(b => (b.content || '').toLowerCase().includes(q))) : notes;

      if (!filtered.length) {
        list.innerHTML = '<div class="sb-empty">No notes found</div>';
        return;
      }

      list.innerHTML = filtered.map(n => {
        const isActive = n.id === activeNoteId;
        const preview = (n.blocks.find(b => b.type === 'text' && b.content) || n.blocks[1] || n.blocks[0]);
        const text = stripHtml(preview ? preview.content : '');
        const time = timeAgo(n.updatedAt);
        return `
          <div class="note-item ${isActive ? 'active' : ''}" data-id="${n.id}">
            <div class="ni-title">${escapeHtml(n.title || 'Untitled')}</div>
            <div class="ni-preview">${escapeHtml(text.slice(0, 50))}</div>
            <div class="ni-time">${time}</div>
            <span class="ni-menu" data-id="${n.id}">⋯</span>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.note-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('ni-menu')) return;
          openNote(el.dataset.id);
        });
      });
      list.querySelectorAll('.ni-menu').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          showNoteCtx(e, el.dataset.id);
        });
      });
    }

    function openNote(id) {
      activeNoteId = id;
      const note = notes.find(n => n.id === id);
      if (!note) return;
      document.getElementById('noteTitle').value = note.title || '';
      renderEditor(note.blocks);
      renderSidebar();
    }

    // ===== EDITOR =====
    function renderEditor(blocks) {
      const body = document.getElementById('editorBody');
      body.innerHTML = '';
      blocks.forEach((block, idx) => {
        const el = createBlockEl(block, idx);
        body.appendChild(el);
      });
      // Ensure last block is text
      if (!blocks.length || blocks[blocks.length - 1].type !== 'text') {
        appendBlock({ type: 'text', content: '' });
      }
    }

    function createBlockEl(block, idx) {
      const div = document.createElement('div');
      div.className = `block ${block.type}`;
      div.dataset.index = idx;
      if (block.type === 'numbered') div.dataset.num = block.num || (idx + 1);

      let inner = '';
      if (block.type === 'todo') {
        inner = `<div class="todo-check ${block.checked ? 'checked' : ''}">${block.checked ? '✓' : ''}</div>`;
      }

      if (block.type === 'code') {
        const raw = block.rawContent !== undefined ? block.rawContent : stripHtml(block.content || '');
        const language = block.language || 'plain';
        div.dataset.raw = raw;
        div.dataset.language = language;

        let displayHtml = escapeHtml(raw);
        if (language !== 'plain' && window.Prism && Prism.languages[language]) {
          displayHtml = Prism.highlight(raw, Prism.languages[language], language);
        }
        inner += `<div class="code-lang-badge">${language}</div>`;
        inner += `<div class="block-content" contenteditable="true" data-placeholder="${placeholderFor('code')}">${displayHtml}</div>`;
      } else if (block.type === 'image') {
        div.dataset.src = block.src || '';
        inner += `
          <div class="image-container">
            ${block.src ? `<img src="${escapeHtml(block.src)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
            <div class="image-placeholder" style="${block.src ? 'display:none' : ''}">
              <span>🖼️ Paste image URL</span>
              <input type="text" class="embed-url" placeholder="https://..." value="${escapeHtml(block.src || '')}">
            </div>
          </div>
          <div class="block-content" contenteditable="true" data-placeholder="Caption (optional)">${block.content || ''}</div>
        `;
      } else if (block.type === 'media') {
        div.dataset.src = block.src || '';
        inner += `
          <div class="media-container">
            ${block.src ? `<iframe src="${escapeHtml(block.src)}" frameborder="0" allowfullscreen></iframe>` : ''}
            <div class="media-placeholder" style="${block.src ? 'display:none' : ''}">
              <span>🎬 Paste video / embed URL</span>
              <input type="text" class="embed-url" placeholder="https://youtube.com/... or https://...">
            </div>
          </div>
          <div class="block-content" contenteditable="true" data-placeholder="Caption (optional)">${block.content || ''}</div>
        `;
      } else {
        inner += `<div class="block-content" contenteditable="true" data-placeholder="${placeholderFor(block.type)}" data-type="${block.type}">${block.content || ''}</div>`;
      }

      div.innerHTML = inner;

      const content = div.querySelector('.block-content');
      if (content) {
        if (block.type === 'code') {
          content.addEventListener('focus', () => {
            const raw = div.dataset.raw || '';
            content.textContent = raw;
            content.classList.add('editing');
            activeBlock = div;
          });
          content.addEventListener('blur', () => {
            const raw = content.innerText;
            div.dataset.raw = raw;
            const language = div.dataset.language || 'plain';
            let displayHtml = escapeHtml(raw);
            if (language !== 'plain' && window.Prism && Prism.languages[language]) {
              displayHtml = Prism.highlight(raw, Prism.languages[language], language);
            }
            content.innerHTML = displayHtml;
            content.classList.remove('editing');
            saveActiveNote();
          });
          content.addEventListener('input', () => {
            div.dataset.raw = content.innerText;
            saveActiveNoteDebounced();
          });
          content.addEventListener('keydown', (e) => onBlockKeydown(e, div, block));
        } else {
          content.addEventListener('input', () => onBlockInput(div, block));
          content.addEventListener('keydown', (e) => onBlockKeydown(e, div, block));
          content.addEventListener('focus', () => { activeBlock = div; });
        }
      }

      if (block.type === 'todo') {
        const check = div.querySelector('.todo-check');
        check.addEventListener('click', () => {
          block.checked = !block.checked;
          check.classList.toggle('checked', block.checked);
          check.textContent = block.checked ? '✓' : '';
          div.classList.toggle('checked', block.checked);
          saveActiveNote();
        });
      }

      if (block.type === 'code') {
        const badge = div.querySelector('.code-lang-badge');
        if (badge) {
          badge.addEventListener('click', (e) => {
            e.stopPropagation();
            langTargetBlock = div;
            showLangPicker(div);
          });
        }
      }

      if (block.type === 'image' || block.type === 'media') {
        const input = div.querySelector('.embed-url');
        if (input) {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const url = input.value.trim();
              const note = notes.find(n => n.id === activeNoteId);
              if (!note) return;
              const bidx = +div.dataset.index;
              note.blocks[bidx].src = url;
              saveNotes();
              const newDiv = createBlockEl(note.blocks[bidx], bidx);
              div.replaceWith(newDiv);
              const cap = newDiv.querySelector('.block-content');
              if (cap) cap.focus();
            }
          });
        }
      }

      return div;
    }

    function placeholderFor(type) {
      if (type === 'text') return "Type something, or press '/' for commands...";
      if (type === 'code') return '// code...';
      if (type === 'image') return 'Caption (optional)';
      if (type === 'media') return 'Caption (optional)';
      return '';
    }

    let activeBlock = null;

    function onBlockInput(div, block) {
      const content = div.querySelector('.block-content');
      block.content = content.innerHTML;
      saveActiveNoteDebounced();
    }

    function onBlockKeydown(e, div, block) {
      const content = div.querySelector('.block-content');
      const text = content.innerText;

      // Slash command
      if (text === '/' && e.key !== 'Backspace' && e.key !== 'Escape') {
        showSlashMenu(div, content);
        return;
      }

      // Markdown shortcuts
      if (e.key === ' ') {
        const trimmed = text.trim();
        const map = {
          '#': 'h1', '##': 'h2', '###': 'h3',
          '-': 'bullet', '1.': 'numbered',
          '[]': 'todo', '>': 'quote',
        };
        if (map[trimmed]) {
          e.preventDefault();
          changeBlockType(div, block, map[trimmed]);
          return;
        }
        if (trimmed === '```' || trimmed === '---') {
          e.preventDefault();
          if (trimmed === '---') changeBlockType(div, block, 'divider');
          else changeBlockType(div, block, 'code');
          return;
        }
      }

      // Enter = new block below
      if (e.key === 'Enter' && !e.shiftKey && block.type !== 'code') {
        e.preventDefault();
        const idx = +div.dataset.index;
        const newBlock = { type: 'text', content: '' };
        insertBlockAt(idx + 1, newBlock);
        return;
      }

      // Backspace on empty block = delete
      if (e.key === 'Backspace' && text === '' && block.type !== 'text') {
        e.preventDefault();
        if (block.type === 'image' || block.type === 'media') {
          const idx = +div.dataset.index;
          if (idx > 0) {
            removeBlockAt(idx);
            focusBlockAt(idx - 1, 'end');
          }
          return;
        }
        changeBlockType(div, block, 'text');
        return;
      }
      if (e.key === 'Backspace' && text === '' && block.type === 'text') {
        const idx = +div.dataset.index;
        if (idx > 0) {
          e.preventDefault();
          removeBlockAt(idx);
          focusBlockAt(idx - 1, 'end');
        }
        return;
      }

      // Arrow up/down navigation
      if (e.key === 'ArrowUp' && isAtStart(content)) {
        const idx = +div.dataset.index;
        if (idx > 0) { e.preventDefault(); focusBlockAt(idx - 1, 'end'); }
      }
      if (e.key === 'ArrowDown' && isAtEnd(content)) {
        const idx = +div.dataset.index;
        const total = document.querySelectorAll('.block').length;
        if (idx < total - 1) { e.preventDefault(); focusBlockAt(idx + 1, 'start'); }
      }
    }

    function isAtStart(el) {
      const sel = window.getSelection();
      if (!sel.rangeCount) return false;
      const range = sel.getRangeAt(0);
      return range.startOffset === 0 && range.startContainer === el.firstChild;
    }
    function isAtEnd(el) {
      const sel = window.getSelection();
      if (!sel.rangeCount) return false;
      const range = sel.getRangeAt(0);
      return range.endOffset === (range.endContainer.length || 0) && range.endContainer === el.lastChild;
    }

    function changeBlockType(div, block, newType) {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      const idx = +div.dataset.index;
      block.type = newType;
      block.content = '';
      if (newType === 'todo') block.checked = false;
      if (newType === 'code') {
        block.language = 'plain';
        block.rawContent = '';
      }
      if (newType === 'image' || newType === 'media') {
        block.src = '';
      }
      note.blocks[idx] = block;
      const newDiv = createBlockEl(block, idx);
      div.replaceWith(newDiv);
      const content = newDiv.querySelector('.block-content');
      content.focus();
      placeCaretAtEnd(content);
      saveActiveNote();
    }

    function insertBlockAt(index, block) {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note.blocks.splice(index, 0, block);
      const body = document.getElementById('editorBody');
      const all = body.querySelectorAll('.block');
      const ref = all[index] || null;
      const newDiv = createBlockEl(block, index);
      if (ref) body.insertBefore(newDiv, ref);
      else body.appendChild(newDiv);
      reindexBlocks();
      const content = newDiv.querySelector('.block-content');
      content.focus();
      saveActiveNote();
    }

    function removeBlockAt(index) {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note.blocks.splice(index, 1);
      const body = document.getElementById('editorBody');
      const all = body.querySelectorAll('.block');
      if (all[index]) all[index].remove();
      reindexBlocks();
      saveActiveNote();
    }

    function appendBlock(block) {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note.blocks.push(block);
      const body = document.getElementById('editorBody');
      const idx = note.blocks.length - 1;
      const div = createBlockEl(block, idx);
      body.appendChild(div);
      saveActiveNote();
    }

    function reindexBlocks() {
      document.querySelectorAll('.block').forEach((div, i) => {
        div.dataset.index = i;
        if (div.classList.contains('numbered')) div.dataset.num = i + 1;
      });
    }

    function focusBlockAt(index, pos) {
      const all = document.querySelectorAll('.block');
      const div = all[index];
      if (!div) return;
      const content = div.querySelector('.block-content');
      if (!content) return;
      content.focus();
      if (pos === 'end') placeCaretAtEnd(content);
      else placeCaretAtStart(content);
    }

    function placeCaretAtEnd(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    function placeCaretAtStart(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // ===== SLASH MENU =====
    let slashActive = false;
    let slashIndex = 0;
    let slashTargetBlock = null;

    function setupSlashMenu() {
      const menu = document.getElementById('slashMenu');
      menu.innerHTML = SLASH_ITEMS.map((item, i) => `
        <div class="slash-item ${i === 0 ? 'active' : ''}" data-type="${item.type}" data-idx="${i}">
          <div class="si-icon">${item.icon}</div>
          <div class="si-label">${item.label}<div style="font-size:11px;color:var(--text-muted);margin-top:1px">${item.desc}</div></div>
          ${item.shortcut ? `<span class="si-kbd">${item.shortcut}</span>` : ''}
        </div>
      `).join('');

      menu.querySelectorAll('.slash-item').forEach(el => {
        el.addEventListener('click', () => applySlashItem(el.dataset.type));
        el.addEventListener('mouseenter', () => {
          menu.querySelectorAll('.slash-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          slashIndex = +el.dataset.idx;
        });
      });
    }

    function showSlashMenu(div, contentEl) {
      const menu = document.getElementById('slashMenu');
      const rect = contentEl.getBoundingClientRect();
      menu.style.display = 'block';
      menu.style.left = rect.left + 'px';
      menu.style.top = (rect.bottom + 4) + 'px';
      slashActive = true;
      slashIndex = 0;
      slashTargetBlock = div;
      highlightSlashItem();
    }
    function hideSlashMenu() {
      document.getElementById('slashMenu').style.display = 'none';
      slashActive = false;
      slashTargetBlock = null;
    }
    function highlightSlashItem() {
      document.querySelectorAll('.slash-item').forEach((el, i) => {
        el.classList.toggle('active', i === slashIndex);
      });
    }
    function applySlashItem(type) {
      if (!slashTargetBlock) return;
      if (type === 'code') {
        langTargetBlock = slashTargetBlock;
        showLangPicker(slashTargetBlock);
        hideSlashMenu();
        return;
      }
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      const idx = +slashTargetBlock.dataset.index;
      const block = note.blocks[idx];
      block.type = type;
      block.content = '';
      if (type === 'todo') block.checked = false;
      if (type === 'image' || type === 'media') block.src = '';
      note.blocks[idx] = block;
      const newDiv = createBlockEl(block, idx);
      slashTargetBlock.replaceWith(newDiv);
      hideSlashMenu();
      const content = newDiv.querySelector('.block-content');
      if (content) {
        content.focus();
        placeCaretAtEnd(content);
      }
      saveActiveNote();
    }

    // ===== LANGUAGE PICKER =====
    function setupLangPicker() {
      const menu = document.getElementById('langPicker');
      menu.innerHTML = LANGUAGES.map((lang, i) => `
        <div class="lang-item ${i === 0 ? 'active' : ''}" data-id="${lang.id}" data-idx="${i}">
          <span class="li-label">${lang.label}</span>
          <span class="li-kbd">${lang.id}</span>
        </div>
      `).join('');
      menu.querySelectorAll('.lang-item').forEach(el => {
        el.addEventListener('click', () => applyLang(el.dataset.id));
        el.addEventListener('mouseenter', () => {
          menu.querySelectorAll('.lang-item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          langIndex = +el.dataset.idx;
        });
      });
    }
    function showLangPicker(div) {
      const menu = document.getElementById('langPicker');
      const rect = div.getBoundingClientRect();
      menu.style.display = 'block';
      menu.style.left = rect.left + 'px';
      menu.style.top = (rect.bottom + 4) + 'px';
      langActive = true;
      langIndex = 0;
      const currentLang = div.dataset.language;
      if (currentLang) {
        const idx = LANGUAGES.findIndex(l => l.id === currentLang);
        if (idx >= 0) langIndex = idx;
      }
      highlightLangItem();
    }
    function hideLangPicker() {
      document.getElementById('langPicker').style.display = 'none';
      langActive = false;
      langTargetBlock = null;
    }
    function highlightLangItem() {
      document.querySelectorAll('.lang-item').forEach((el, i) => {
        el.classList.toggle('active', i === langIndex);
      });
    }
    function applyLang(language) {
      if (!langTargetBlock) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      const idx = +langTargetBlock.dataset.index;
      const block = note.blocks[idx];
      if (block.type === 'code') {
        block.language = language;
        const newDiv = createBlockEl(block, idx);
        langTargetBlock.replaceWith(newDiv);
        hideLangPicker();
        const content = newDiv.querySelector('.block-content');
        if (content) content.focus();
        saveActiveNote();
        return;
      }
      block.type = 'code';
      block.content = '';
      block.rawContent = block.rawContent || stripHtml(block.content || '');
      block.language = language;
      const newDiv = createBlockEl(block, idx);
      langTargetBlock.replaceWith(newDiv);
      hideLangPicker();
      const content = newDiv.querySelector('.block-content');
      if (content) {
        content.focus();
        placeCaretAtEnd(content);
      }
      saveActiveNote();
    }

    // ===== SAVE =====
    let debounceTimer = null;
    function saveActiveNoteDebounced() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(saveActiveNote, 800);
    }
    function saveActiveNote() {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note.title = document.getElementById('noteTitle').value;
      note.updatedAt = Date.now();
      // Rebuild blocks from DOM
      const body = document.getElementById('editorBody');
      const domBlocks = body.querySelectorAll('.block');
      note.blocks = Array.from(domBlocks).map(div => {
        const type = Array.from(div.classList).find(c => c !== 'block') || 'text';
        const contentEl = div.querySelector('.block-content');
        const checked = div.querySelector('.todo-check')?.classList.contains('checked') || false;

        let content = contentEl?.innerHTML || '';
        let rawContent = undefined;
        let language = undefined;
        let src = undefined;

        if (type === 'code') {
          rawContent = div.dataset.raw || '';
          language = div.dataset.language || 'plain';
        }
        if (type === 'image' || type === 'media') {
          src = div.dataset.src || '';
        }

        return { type, content, checked, rawContent, language, src };
      });
      saveNotes();
      renderSidebar();
    }

    // ===== EXPORT =====
    function exportMarkdown() {
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      let md = `# ${note.title || 'Untitled'}\n\n`;
      note.blocks.forEach(b => {
        const text = stripHtml(b.content).trim();
        if (!text && b.type !== 'divider' && b.type !== 'image' && b.type !== 'media') return;
        switch(b.type) {
          case 'h1': md += `# ${text}\n\n`; break;
          case 'h2': md += `## ${text}\n\n`; break;
          case 'h3': md += `### ${text}\n\n`; break;
          case 'bullet': md += `- ${text}\n`; break;
          case 'numbered': md += `1. ${text}\n`; break;
          case 'todo': md += `- [${b.checked ? 'x' : ' '}] ${text}\n`; break;
          case 'quote': md += `> ${text}\n\n`; break;
          case 'code': md += `\`\`\`${b.language || ''}\n${b.rawContent || stripHtml(b.content)}\n\`\`\`\n\n`; break;
          case 'divider': md += `---\n\n`; break;
          case 'image': md += `![${text}](${b.src || ''})\n\n`; break;
          case 'media': md += `[${text}](${b.src || ''})\n\n`; break;
          default: md += `${text}\n\n`; break;
        }
      });
      navigator.clipboard.writeText(md).then(() => {
        showSaveStatus();
        const btn = document.getElementById('btnExport');
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    // ===== EVENTS =====
    function setupEvents() {
      document.getElementById('btnNew').addEventListener('click', createNote);
      document.getElementById('noteTitle').addEventListener('input', saveActiveNoteDebounced);
      document.getElementById('searchInput').addEventListener('input', renderSidebar);
      document.getElementById('btnExport').addEventListener('click', exportMarkdown);

      // Slash menu & lang picker keyboard nav
      document.addEventListener('keydown', (e) => {
        if (langActive) {
          if (e.key === 'ArrowDown') { e.preventDefault(); langIndex = Math.min(langIndex + 1, LANGUAGES.length - 1); highlightLangItem(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); langIndex = Math.max(langIndex - 1, 0); highlightLangItem(); }
          else if (e.key === 'Enter') { e.preventDefault(); applyLang(LANGUAGES[langIndex].id); }
          else if (e.key === 'Escape') { e.preventDefault(); hideLangPicker(); }
          return;
        }
        if (!slashActive) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault(); createNote();
          }
          if (e.key === 'Escape') hideNoteCtx();
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); slashIndex = Math.min(slashIndex + 1, SLASH_ITEMS.length - 1); highlightSlashItem(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); slashIndex = Math.max(slashIndex - 1, 0); highlightSlashItem(); }
        else if (e.key === 'Enter') { e.preventDefault(); applySlashItem(SLASH_ITEMS[slashIndex].type); }
        else if (e.key === 'Escape') { e.preventDefault(); hideSlashMenu(); }
      });

      // Note context menu
      document.getElementById('noteCtx').querySelectorAll('.note-ctx-item').forEach(item => {
        item.addEventListener('click', () => {
          const action = item.dataset.action;
          const id = document.getElementById('noteCtx').dataset.targetId;
          hideNoteCtx();
          if (action === 'delete') deleteNote(id);
          if (action === 'duplicate') duplicateNote(id);
          if (action === 'rename') renameNote(id);
        });
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.note-ctx')) hideNoteCtx();
      });

      // Click away menus
      document.addEventListener('click', (e) => {
        if (slashActive && !e.target.closest('.slash-menu') && !e.target.closest('.block')) {
          hideSlashMenu();
        }
        if (langActive && !e.target.closest('.lang-picker') && !e.target.closest('.block')) {
          hideLangPicker();
        }
      });
    }

    function showNoteCtx(e, noteId) {
      const menu = document.getElementById('noteCtx');
      menu.dataset.targetId = noteId;
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
      menu.classList.add('show');
    }
    function hideNoteCtx() {
      document.getElementById('noteCtx').classList.remove('show');
    }

    // ===== UTILS =====
    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const sec = Math.floor(diff / 1000);
      if (sec < 60) return 'Just now';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + 'm ago';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + 'h ago';
      const day = Math.floor(hr / 24);
      return day + 'd ago';
    }

    // ===== START =====
    init();
  </script>
</body>
</html>
